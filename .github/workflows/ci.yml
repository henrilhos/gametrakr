name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        env:
          SKIP_ENV_VALIDATION: true

  typecheck:
    name: "Typecheck"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

  unit:
    name: "Unit tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest --coverage
        env:
          SKIP_ENV_VALIDATION: true

      - name: Report coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2

  build:
    name: "Build"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: postgresql://gametrakr:gametrakr@localhost:5432/gametrakr_ci
          LOCAL_DEV: true
          NEXT_PUBLIC_LOCAL_DEV: true
          NEXTAUTH_SECRET: ci-only-secret
          NEXTAUTH_URL: http://localhost:3000
          SKIP_ENV_VALIDATION: true
          TWITCH_CLIENT_ID: ci-only-client-id
          TWITCH_SECRET_ID: ci-only-secret

  integration:
    name: "Database integration tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run database integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://gametrakr:gametrakr@localhost:5432/gametrakr_test
          NODE_ENV: test
          SKIP_ENV_VALIDATION: true
